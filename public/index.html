<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#14161a">
  <title>Field&amp;Forms Research Workspace</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login" class="login hidden">
    <div class="login-card">
      <img src="/icons/icon-192.png" alt="" class="login-logo">
      <h1>Field&amp;Forms<span>Research Workspace</span></h1>
      <p class="muted">Pick your name, then enter your PIN.</p>
      <div id="name-picker" class="name-picker"></div>
      <form id="login-form">
        <input id="pin" type="password" inputmode="text" autocomplete="current-password" placeholder="PIN" aria-label="PIN" required>
        <button type="submit" class="brass" id="login-btn">Sign in</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><img src="/icons/icon-192.png" alt=""><div>Field&amp;Forms<small>Research Workspace</small></div></div>
      <nav id="rooms"></nav>
      <div class="me"><span id="me-name"></span><button id="logout" class="ghost small">Sign out</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h2 id="room-title"></h2><p id="room-desc" class="muted"></p></div>
        <a id="transcript-link" class="filter hidden" href="/transcript.html?room=talk">Full transcript</a>
        <label class="filter">People
          <select id="people-filter"><option value="">Everyone</option></select>
        </label>
      </header>
      <div id="view" class="view"></div>
    </main>
  </section>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
