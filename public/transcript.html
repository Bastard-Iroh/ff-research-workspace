<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#14161a">
  <title>Transcript · Field&amp;Forms Research Workspace</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="transcript-page">
  <main class="docpane" style="max-width:900px;margin:0 auto">
    <p><a href="/" class="filter">← Back to workspace</a></p>
    <h3 id="t-title">Full transcript</h3>
    <p class="muted" id="t-meta"></p>
    <div class="toolbar" id="t-controls">
      <label class="filter">Room <select id="t-room"></select></label>
      <button class="ghost small" id="t-first">« First</button>
      <button class="ghost small" id="t-prev">‹ Older</button>
      <span class="muted" id="t-page"></span>
      <button class="ghost small" id="t-next">Newer ›</button>
      <button class="ghost small" id="t-last">Latest »</button>
    </div>
    <div class="feed" id="t-feed" style="padding:12px 0"></div>
    <p class="error" id="t-error"></p>
  </main>
  <script src="/transcript.js"></script>
</body>
</html>
